<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환자 화면</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="screen">
    <h1>환자 화면</h1>

    <div id="doctor-message" style="margin-bottom: 40px;">
      <p>의료진 메시지:</p>
      <div id="received" style="font-size: 1.5rem; font-weight: bold; color: #2b6cb0;">
        대기 중...
      </div>
    </div>

    <div id="camera-section">
      <p>수어로 증상을 표현해주세요</p>
      <video id="camera" autoplay playsinline
        style="width: 320px; height: 240px; border-radius: 12px; background: #000;">
      </video>
      <div id="recognized" style="margin-top: 16px; font-size: 1.3rem; color: #c53030;">
        인식 대기 중...
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBtzt-_sU8254xSSJ29jnNNpRKZz3X5nMs",
      authDomain: "sign-health.firebaseapp.com",
      databaseURL: "https://sign-health-default-rtdb.firebaseio.com",
      projectId: "sign-health",
      storageBucket: "sign-health.firebasestorage.app",
      messagingSenderId: "117629635026",
      appId: "1:117629635026:web:9d0e632ae33bec361fa00b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 의료진 메시지 수신
    onValue(ref(db, 'doctor_message'), (snapshot) => {
      const data = snapshot.val();
      if (data) document.getElementById('received').innerText = data.text;
    });

    // MediaPipe 카메라 연결
    const videoEl = document.getElementById('camera');

    const hands = new Hands({
      locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
      }
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      const el = document.getElementById('recognized');
      if (!results.landmarks || results.landmarks.length === 0) {
        el.innerText = '인식 대기 중...';
        el.style.color = '#c53030';
        return;
      }

    const lm = results.landmarks[0];

    // 손가락 펴짐 여부 확인
    const fingers = {
        index: lm[8].y < lm[6].y,  // 검지
        middle: lm[12].y < lm[10].y,  // 중지
        ring: lm[16].y < lm[14].y,  // 약지
        pinky: lm[20].y < lm[18].y,  // 소지
        thumb: lm[4].x < lm[3].x  // 엄지
    };

    const allClosed = !fingers.index && !fingers.middle && !fingers.ring && !fingers.pinky;
    const onlyIndex = fingers.index && !fingers.middle && !fingers.ring && !fingers.pinky;
    const allOpen = fingers.index && fingers.middle && fingers.ring && fingers.pinky;

    // 손 위치
    const handY = lm[0].y; // 0=상단, 1=하단
    const handX = lm[0].x;
    const atFace = handY < 0.4;     // 얼굴 높이
    const atChset = handY > 0.4 && handY < 0.7; // 가슴 높이

    let gesture = '';

    // 아프다: 손가락 느슨하게 오므림, 가슴 높이
    if (allClosed && atChset) {
        gesture = '아프다';
    }
    // 어지럽다: 주먹, 얼굴 높이
    else if (allClosed && atFace) {
        gesture = '어지럽다';
    }
    // 두통: 검지만 펴고 얼굴 높이
    else if (onlyIndex && atFace) {
        gesture = '두통';
    }
    // 약: 모든 손가락 펴고 가슴 높이
    else if (allOpen && atChset) {
        gesture = '약';
    }
    // 피곤: 모든 손가락 펴고 양손
    else if (allOpen && results.landmarks.length > 0) {
        gesture = '피곤';
    }

    if (gesture) {
        el.innerText = gesture + ' 인식됨';
        el.style.color = '#2b6cb0';
        // 의료진에게 전송
        set(ref(db, 'patient_message'), {
            text: gesture,
            time: Date.now()
        });
    } else {
        el.innerText = '손 인식됨 ✋';
        el.style.color = '#2b6cb0';
    }
 });


    camera.start();
  </script>

</body>
</html>
