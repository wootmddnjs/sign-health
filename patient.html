<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>환자 화면</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface2: #f9fafb;
      --border: #e0e3ea;
      --fg: #111827;
      --fg2: #374151;
      --fg3: #6b7280;
      --fg4: #9ca3af;
      --accent: #1d4ed8;
      --accent-bg: #eff6ff;
      --accent-border: #bfdbfe;
      --green: #15803d;
      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;
      --statusbar: #1e2537;
      --statusbar-fg: #c9d0e0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      height: 100%;
      font-size: 14px;
      overflow: hidden;
    }

    /* Top nav */
    .topnav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .topnav-left { display: flex; align-items: center; gap: 16px; }
    .app-name { font-size: 15px; font-weight: 700; color: var(--fg); letter-spacing: -0.02em; }
    .app-name span { color: var(--accent); }
    .nav-divider { width: 1px; height: 18px; background: var(--border); }
    .role-badge { display: flex; align-items: center; gap: 8px; }
    .role-tag {
      background: var(--green); color: white;
      font-size: 11px; font-weight: 700;
      padding: 3px 9px; border-radius: 4px; letter-spacing: 0.04em;
    }
    .dept-tag {
      background: var(--green-bg); border: 1px solid var(--green-border);
      color: var(--green); font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 4px;
    }

    /* Layout */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 480px;
      min-height: 0;
      gap: 0;
    }

    /* Left: camera panel */
    .camera-panel {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      min-height: 0;
    }

    .camera-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      flex-shrink: 0;
    }
    .camera-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
      aspect-ratio: 4/3;
      width: 70%;
      max-height: none;
    }
    .patient-info-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }
    .pi-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--accent-bg); border: 1px solid var(--accent-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--accent); flex-shrink: 0;
    }
    .pi-name { font-size: 15px; font-weight: 700; color: var(--fg); letter-spacing: -0.02em; }
    .pi-meta { font-size: 11px; color: var(--fg3); margin-top: 1px; }
    .pi-divider { height: 1px; background: var(--border); }
    .pi-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 3px 0;
    }
    .pi-key { font-size: 10px; color: var(--fg4); font-weight: 500; }
    .pi-val { font-size: 12px; font-weight: 700; color: var(--fg2); }
    .pi-val.red { color: #b91c1c; }
    .pi-bp {
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 8px; padding: 8px 10px; text-align: center;
    }
    .pi-bp-val { font-size: 20px; font-weight: 700; color: #b91c1c; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .pi-bp-label { font-size: 9px; color: #b91c1c; font-weight: 500; letter-spacing: 0.04em; margin-top: 1px; }
    .pi-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 4px; letter-spacing: 0.03em;
    }
    .pi-badge.dept { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
    .pi-badge.disability { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .live-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(220, 38, 38, 0.92);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 10;
    }
    .live-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: livePulse 1.2s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    #camera {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .camera-svg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* Recognition result */
    .recog-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
      flex-shrink: 0;
    }
    .recog-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--fg4); flex-shrink: 0;
      transition: background 0.3s;
    }
    .recog-dot.detecting { background: #f59e0b; animation: pulse 1s infinite; }
    .recog-dot.confirmed { background: var(--green); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .recog-main { flex: 1; }
    .recog-label { font-size: 10px; font-weight: 600; color: var(--fg4); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 3px; }
    .recog-text { font-size: 22px; font-weight: 700; color: var(--fg3); letter-spacing: -0.02em; }
    .recog-text.detecting { color: #d97706; }
    .recog-text.confirmed { color: var(--green); }
    .recog-progress {
      font-size: 10px; color: var(--fg4); margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    /* Gesture guide */
    .gesture-guide {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      max-height: 220px;
    }
    #gestureRankList {
      overflow-y: auto;
      flex: 1;
    }
    .gesture-guide-header {
      padding: 8px 14px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .gesture-guide-label {
      font-size: 10px; font-weight: 600; color: var(--fg3);
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .gesture-guide-note {
      font-size: 10px; color: var(--accent); font-weight: 500;
    }
    .gesture-row {
      padding: 7px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      transition: background 0.15s;
    }
    .gesture-row:last-child { border-bottom: none; }
    .gesture-row.top1 { background: var(--accent-bg); }
    .gesture-status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--border); flex-shrink: 0;
      transition: background 0.2s;
    }
    .gesture-status-dot.active { background: var(--accent); }
    .gesture-code {
      font-size: 13px; font-weight: 700; color: var(--fg);
      min-width: 52px; letter-spacing: -0.01em;
    }
    .gesture-bar-wrap {
      flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .gesture-bar {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width 0.15s ease;
    }
    .gesture-pct {
      font-size: 10px; font-weight: 600; color: var(--fg3);
      min-width: 32px; text-align: right; font-variant-numeric: tabular-nums;
    }
    .gesture-hint { display: none; }

    /* Right: message panel */
    .message-panel {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow-y: auto;
      min-height: 0;
    }
    .msg-section {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }
    .msg-section:last-child { border-bottom: none; }
    .msg-section-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--fg4); margin-bottom: 10px;
    }

    /* Doctor message */
    .doctor-msg-box {
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 8px; padding: 12px 14px;
    }
    .doctor-msg-label { font-size: 10px; font-weight: 600; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
    .doctor-msg-text {
      font-size: 22px; font-weight: 600; color: #111827;
      letter-spacing: -0.01em; line-height: 1.7;
    }
    .doctor-msg-text .emph {
      font-size: 1.36em;
      font-weight: 900;
      color: #1d4ed8;
      background: #dbeafe;
      border-radius: 5px;
      padding: 1px 5px;
    }
    .doctor-msg-time { font-size: 10px; color: #3b82f6; margin-top: 4px; font-variant-numeric: tabular-nums; }

    /* Received history */
    .recv-row {
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .recv-row:last-child { border-bottom: none; }
    .recv-sender {
      font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
      padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
    }
    .recv-sender.doctor { background: #eff6ff; color: #1d4ed8; }
    .recv-sender.nurse  { background: #f0fdfa; color: #0f766e; }
    .recv-text { font-size: 14px; font-weight: 500; color: var(--fg2); flex: 1; }
    .recv-time { font-size: 10px; color: var(--fg4); font-variant-numeric: tabular-nums; }

    /* Patient sent */
    .patient-sent-row {
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 2px;
    }
    .patient-sent-row:last-child { border-bottom: none; }
    .patient-sent-text { font-size: 15px; font-weight: 700; color: var(--green); }
    .patient-sent-meta { font-size: 10px; color: var(--fg4); font-variant-numeric: tabular-nums; }

    /* Status bar */
    .statusbar {
      background: var(--statusbar); color: var(--statusbar-fg);
      height: 28px; display: flex; align-items: center;
      padding: 0 16px; gap: 20px; flex-shrink: 0;
      font-size: 11px; font-variant-numeric: tabular-nums;
    }
    .statusbar-item { display: flex; align-items: center; gap: 6px; }
    .status-dot-sm { width: 5px; height: 5px; border-radius: 50%; background: #6b7280; }
    .status-dot-sm.connected { background: #22c55e; }
    .statusbar-divider { width: 1px; height: 12px; background: rgba(255,255,255,0.15); }
    .statusbar-spacer { flex: 1; }
  </style>
</head>
<body>

<div class="topnav">
  <div class="topnav-left">
    <div class="app-name">Sign<span>Health</span></div>
    <div class="nav-divider"></div>
    <div class="role-badge">
      <span class="role-tag">환자</span>
    </div>
  </div>
</div>

<div class="main">

  <!-- Left: Camera + gesture guide -->
  <div class="camera-panel">

    <div class="camera-row">
      <div class="camera-wrap">
        <div class="live-badge">LIVE</div>
        <video id="camera" autoplay playsinline muted></video>
        <svg class="camera-svg" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet">
          <ellipse id="silhouette-head" cx="160" cy="60" rx="35" ry="42"
            fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-dasharray="6,4"/>
          <path id="silhouette-shoulder" d="M100,110 Q160,95 220,110"
            fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-dasharray="6,4"/>
          <path id="silhouette-body" d="M100,110 L90,200 M220,110 L230,200"
            fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-dasharray="6,4"/>
          <text x="160" y="228" text-anchor="middle"
            fill="rgba(255,255,255,0.8)" font-size="11" font-family="sans-serif">
            실루엣에 맞춰 앉아주세요
          </text>
        </svg>
      </div>

      <!-- 환자 정보 카드 -->
      <div class="patient-info-card">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="pi-avatar">김</div>
          <div>
            <div class="pi-name">김○○</div>
            <div class="pi-meta">67세 · 여성</div>
          </div>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;">
          <span class="pi-badge dept">고혈압 외래</span>
          <span class="pi-badge disability">청각장애 2급</span>
        </div>
        <div class="pi-divider"></div>
        <div class="pi-bp">
          <div class="pi-bp-val">158 / 96</div>
          <div class="pi-bp-label">수축기 / 이완기 (mmHg)</div>
        </div>
        <div class="pi-divider"></div>
        <div class="pi-row">
          <span class="pi-key">등록번호</span>
          <span class="pi-val">2024-03847</span>
        </div>
        <div class="pi-row">
          <span class="pi-key">담당의</span>
          <span class="pi-val">이○○ 교수</span>
        </div>
        <div class="pi-row">
          <span class="pi-key">담당간호사</span>
          <span class="pi-val">박○○ RN</span>
        </div>
      </div>
    </div>

    <!-- Recognition result card -->
    <div class="recog-card">
      <div class="recog-dot" id="recogDot"></div>
      <div class="recog-main">
        <div class="recog-label">수어 인식 결과</div>
        <div class="recog-text" id="recogText">인식 대기 중...</div>
        <div class="recog-progress" id="recogProgress"></div>
      </div>
    </div>

    <!-- Gesture guide -->
    <div class="gesture-guide">
      <div class="gesture-guide-header">
        <span class="gesture-guide-label">수어 인식 순위</span>
        <span class="gesture-guide-note">신뢰도 높은 순 · 실시간</span>
      </div>
      <div id="gestureRankList"></div>
    </div>

  </div>

  <!-- Right: Message panel -->
  <div class="message-panel">

    <div class="msg-section">
      <div class="msg-section-label">의료진 메시지</div>
      <div class="doctor-msg-box">
        <div class="doctor-msg-label">수신됨</div>
        <div class="doctor-msg-text" id="doctorMsgText" style="line-height:1.5;">대기 중...</div>
        <div class="doctor-msg-time" id="doctorMsgTime">—</div>
      </div>
    </div>

    <div class="msg-section">
      <div class="msg-section-label">수신 내역</div>
      <div id="recvHistory">
        <div style="font-size:12px;color:var(--fg4);">수신 내역 없음</div>
      </div>
    </div>

    <div class="msg-section">
      <div class="msg-section-label">내가 보낸 메시지</div>
      <div id="sentHistory">
        <div style="font-size:12px;color:var(--fg4);">전송 내역 없음</div>
      </div>
    </div>

  </div>
</div>

<div class="statusbar">
  <div class="statusbar-item">
    <div class="status-dot-sm" id="fbDot"></div>
    <span id="fbStatus">Firebase 연결 중...</span>
  </div>
  <div class="statusbar-divider"></div>
  <div class="statusbar-item"><span>고혈압 외래 · 환자 단말</span></div>
  <div class="statusbar-divider"></div>
  <div class="statusbar-item"><span id="roomLabel">방: —</span></div>
  <div class="statusbar-spacer"></div>
  <div class="statusbar-item"><span id="clock"></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBtzt-_sU8254xSSJ29jnNNpRKZz3X5nMs",
    authDomain: "sign-health.firebaseapp.com",
    databaseURL: "https://sign-health-default-rtdb.firebaseio.com",
    projectId: "sign-health",
    storageBucket: "sign-health.firebasestorage.app",
    messagingSenderId: "117629635026",
    appId: "1:117629635026:web:9d0e632ae33bec361fa00b"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 방(Room) 설정 — URL 파라미터 ?room=팀1 로 지정, 없으면 'default'
  const roomId = new URLSearchParams(location.search).get('room') || 'default';
  const roomRef = (path) => db.ref(`rooms/${roomId}/${path}`);
  document.getElementById('roomLabel').textContent = `방: ${roomId}`;

  // Firebase 연결 상태
  db.ref('.info/connected').on('value', (snap) => {
    const dot = document.getElementById('fbDot');
    const status = document.getElementById('fbStatus');
    if (snap.val()) {
      dot.classList.add('connected');
      status.textContent = 'Firebase 연결됨';
    } else {
      dot.classList.remove('connected');
      status.textContent = 'Firebase 연결 중...';
    }
  });

  function timeStr() {
    return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  // 수신 내역
  const recvHistory = [];

  // 의료진 메시지 수신
  roomRef('doctor_message').on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data || !data.text) return;
    const t = new Date(data.time);
    const tStr = t.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const sender = data.sender || '의료진';
    const msgEl = document.getElementById('doctorMsgText');
    // Caption with Intention: 단어별 순차 애니메이션
    function renderCaption(parts) {
      // parts가 없으면 plain text를 단어 단위로 분리
      const tokens = [];
      if (parts && parts.length > 0) {
        parts.forEach(p => {
          // 각 part를 띄어쓰기 기준으로 단어 분리
          const words = p.text.split(/(\s+)/);
          words.forEach(w => tokens.push({ text: w, emph: p.emph }));
        });
      } else {
        data.text.split(/(\s+)/).forEach(w => tokens.push({ text: w, emph: false }));
      }
      let html = '';
      tokens.forEach(tok => {
        if (tok.emph && !/^\s+$/.test(tok.text)) {
          html += `<span class="emph">${tok.text}</span>`;
        } else {
          html += tok.text;
        }
      });
      msgEl.innerHTML = html;
    }
    renderCaption(data.parts);
    document.getElementById('doctorMsgTime').textContent = `${sender} · ${tStr} 수신`;

    recvHistory.unshift({ text: data.text, time: tStr, sender });
    renderRecvHistory();
  });

  function renderRecvHistory() {
    const el = document.getElementById('recvHistory');
    if (recvHistory.length === 0) {
      el.innerHTML = '<div style="font-size:12px;color:var(--fg4);">수신 내역 없음</div>';
      return;
    }
    el.innerHTML = recvHistory.slice(0, 8).map(item => `
      <div class="recv-row">
        <span class="recv-sender ${item.sender === '간호사' ? 'nurse' : 'doctor'}">${item.sender || '의료진'}</span>
        <span class="recv-text">${item.text}</span>
        <span class="recv-time">${item.time}</span>
      </div>
    `).join('');
  }

  // 보낸 내역
  const sentList = [];

  function sendGesture(gesture) {
    roomRef('patient_message').set({ text: gesture, time: Date.now() });
    sentList.unshift({ text: gesture, time: timeStr() });
    renderSentHistory();
  }

  function renderSentHistory() {
    const el = document.getElementById('sentHistory');
    if (sentList.length === 0) {
      el.innerHTML = '<div style="font-size:12px;color:var(--fg4);">전송 내역 없음</div>';
      return;
    }
    el.innerHTML = sentList.slice(0, 8).map(item => `
      <div class="patient-sent-row">
        <span class="patient-sent-text">${item.text}</span>
        <span class="patient-sent-meta">${item.time} · 수어 인식 전송</span>
      </div>
    `).join('');
  }

  // 클래스명에서 "Class N " 접두어 제거 (예: "Class 5 피로" → "피로")
  function cleanClassName(name) {
    return name.replace(/^[Cc]lass\s*\d+\s*/,'').trim();
  }

  // Teachable Machine Pose 모델
  const MODEL_URL = 'https://teachablemachine.withgoogle.com/models/VFnakb498/';
  const CONFIDENCE_THRESHOLD = 0.80; // 80% 이상일 때만 인식
  const CONFIRM_FRAMES = 15;         // 연속 프레임 확인
  const COOLDOWN_MS = 5000;          // 전송 후 5초 쿨다운
  // '없음' 클래스는 무시 (아무 동작 없음)
  const IGNORE_CLASSES = new Set(['없음']);

  const videoEl = document.getElementById('camera');
  let tmModel = null;
  let gestureBuffer = [];
  let lastSentTime = 0;

  function setSilhouette(detected) {
    const color = detected ? 'rgba(72,187,120,0.9)' : 'rgba(255,255,255,0.6)';
    document.getElementById('silhouette-head').setAttribute('stroke', color);
    document.getElementById('silhouette-shoulder').setAttribute('stroke', color);
    document.getElementById('silhouette-body').setAttribute('stroke', color);
  }

  function clearAllDots() {
    document.querySelectorAll('.gesture-status-dot').forEach(d => d.classList.remove('active'));
  }

  function setGestureDot(name, active) {
    const dot = document.getElementById('dot-' + name);
    if (dot) dot.classList.toggle('active', active);
  }

  async function initTM() {
    const recogText = document.getElementById('recogText');
    recogText.textContent = 'AI 모델 로딩 중...';
    try {
      const modelURL = MODEL_URL + 'model.json';
      const metadataURL = MODEL_URL + 'metadata.json';
      tmModel = await tmPose.load(modelURL, metadataURL);
      recogText.textContent = '인식 대기 중...';
      startCamera();
    } catch(e) {
      recogText.textContent = '모델 로드 실패: ' + e.message;
    }
  }

  function updateRankList(predictions) {
    const list = document.getElementById('gestureRankList');
    if (!list) return;
    // 없음 제외 후 신뢰도 내림차순 정렬
    const sorted = predictions
      .map(p => ({ name: cleanClassName(p.className), pct: p.probability }))
      .filter(p => !IGNORE_CLASSES.has(p.name))
      .sort((a, b) => b.pct - a.pct)
      .slice(0, 5);

    list.innerHTML = sorted.map((p, i) => {
      const pctInt = Math.round(p.pct * 100);
      const isTop = i === 0;
      return `<div class="gesture-row${isTop ? ' top1' : ''}">
        <div class="gesture-status-dot${isTop && pctInt >= 50 ? ' active' : ''}"></div>
        <span class="gesture-code">${p.name}</span>
        <div class="gesture-bar-wrap"><div class="gesture-bar" style="width:${pctInt}%"></div></div>
        <span class="gesture-pct">${pctInt}%</span>
      </div>`;
    }).join('');
  }

  function startCamera() {
    navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
      videoEl.srcObject = stream;
      videoEl.play();
      videoEl.onloadeddata = () => { loop(); };
    }).catch((err) => {
      document.getElementById('recogText').textContent = '카메라 오류: ' + err.message;
    });
  }

  async function loop() {
    if (!tmModel) return;
    const recogDot = document.getElementById('recogDot');
    const recogText = document.getElementById('recogText');
    const recogProgress = document.getElementById('recogProgress');

    const { pose, posenetOutput } = await tmModel.estimatePose(videoEl);
    const predictions = await tmModel.predict(posenetOutput);

    // 실시간 순위 리스트 업데이트
    updateRankList(predictions);

    // 가장 높은 confidence 클래스 찾기
    let best = predictions.reduce((a, b) => a.probability > b.probability ? a : b);

    if (pose && pose.keypoints && pose.keypoints.length > 0) {
      setSilhouette(true);
    } else {
      setSilhouette(false);
    }

    const bestClean = cleanClassName(best.className);
    if (best.probability >= CONFIDENCE_THRESHOLD && !IGNORE_CLASSES.has(bestClean)) {
      const gesture = bestClean;

      recogDot.className = 'recog-dot detecting';
      recogText.className = 'recog-text detecting';
      recogText.textContent = gesture;

      gestureBuffer.push(gesture);
      if (gestureBuffer.length > CONFIRM_FRAMES) gestureBuffer.shift();

      const allSame = gestureBuffer.length === CONFIRM_FRAMES &&
        gestureBuffer.every(g => g === gestureBuffer[0]);

      recogProgress.textContent = `${gestureBuffer.filter(g => g === gesture).length} / ${CONFIRM_FRAMES} 프레임`;

      if (allSame) {
        const now = Date.now();
        if (now - lastSentTime > COOLDOWN_MS) {
          lastSentTime = now;
          recogDot.className = 'recog-dot confirmed';
          recogText.className = 'recog-text confirmed';
          recogText.textContent = gesture + ' 전송됨';
          recogProgress.textContent = '✓ 전송 완료';
          sendGesture(gesture);
        }
        gestureBuffer = [];
      }
    } else {
      recogDot.className = 'recog-dot';
      recogText.className = 'recog-text';
      if (best.probability < CONFIDENCE_THRESHOLD || IGNORE_CLASSES.has(bestClean)) {
        recogText.textContent = '인식 대기 중...';
        recogProgress.textContent = '';
      }
      gestureBuffer = [];
    }

    requestAnimationFrame(loop);
  }

  initTM();

  // 시계
  function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
