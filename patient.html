<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환자 화면</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">
    <h1>환자 화면</h1>
    <div id="doctor-message" style="margin-bottom:40px;">
      <p>의료진 메시지:</p>
      <div id="received" style="font-size:1.5rem;font-weight:bold;color:#2b6cb0;">
        대기 중...
      </div>
    </div>
    <div id="camera-section">
      <p>수어로 증상을 표현해주세요</p>
      <div style="position:relative;width:320px;height:240px;margin:0 auto;">
        <video id="camera" autoplay playsinline
          style="width:320px;height:240px;border-radius:12px;background:#000;">
        </video>
        <svg width="320" height="240"
          style="position:absolute;top:0;left:0;pointer-events:none;">
          <ellipse id="silhouette-head" cx="160" cy="60" rx="35" ry="42"
            fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-dasharray="6,4"/>
          <path id="silhouette-shoulder" d="M100,110 Q160,95 220,110"
            fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-dasharray="6,4"/>
          <path id="silhouette-body" d="M100,110 L90,200 M220,110 L230,200"
            fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-dasharray="6,4"/>
          <text x="160" y="225" text-anchor="middle"
            fill="rgba(255,255,255,0.9)" font-size="12" font-family="sans-serif">
            실루엣에 맞춰 앉아주세요
          </text>
        </svg>
      </div>
      <div id="recognized" style="margin-top:16px;font-size:1.3rem;color:#c53030;">
        인식 대기 중...
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBtzt-_sU8254xSSJ29jnNNpRKZz3X5nMs",
      authDomain: "sign-health.firebaseapp.com",
      databaseURL: "https://sign-health-default-rtdb.firebaseio.com",
      projectId: "sign-health",
      storageBucket: "sign-health.firebasestorage.app",
      messagingSenderId: "117629635026",
      appId: "1:117629635026:web:9d0e632ae33bec361fa00b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('doctor_message').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) document.getElementById('received').innerText = data.text;
    });

    const videoEl = document.getElementById('camera');
    const el = document.getElementById('recognized');

    const hands = new Hands({
      locateFile: (file) =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5
    });

    let gestureBuffer = [];
    const CONFIRM_FRAMES = 10;

    hands.onResults((results) => {
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        el.innerText = '인식 대기 중...';
        el.style.color = '#c53030';
        document.getElementById('silhouette-head').setAttribute('stroke', 'rgba(255,255,255,0.7)');
        document.getElementById('silhouette-shoulder').setAttribute('stroke', 'rgba(255.255.255,0.7)');
        document.getElementById('silhouette-body').setAttribute('stroke', 'rgba(255,255,255,0.7)');
        gestureBuffer = []; return;
      }

      const lm = results.multiHandLandmarks[0];
      // 실루엣 색상 변경
      const color = 'rgba(72,187,120,0.9)';
      document.getElementById('silhouette-head').setAttribute('stroke', color);
      document.getElementById('silhouette-shoulder').setAttribute('stroke', color);
      document.getElementById('silhouette-body').setAttribute('stroke', color);
      const fingers = {
        index:  lm[8].y  < lm[6].y,
        middle: lm[12].y < lm[10].y,
        ring:   lm[16].y < lm[14].y,
        pinky:  lm[20].y < lm[18].y
      };

      const allClosed = !fingers.index && !fingers.middle;
      const onlyIndex = fingers.index && !fingers.middle && !fingers.ring && !fingers.pinky;
      const allOpen = fingers.index && fingers.middle && fingers.ring && fingers.pinky;

      const handY = lm[0].y;
      // 오른손에서 엄지(4번)가 소지(20번)보다 x값이 크면 손바닥이 위
      const palmUp = lm[4].x > lm[20].x;
      const atFace  = handY < 0.35;
      const atChest = handY >= 0.45 && handY < 0.95;

      console.log('Y:', handY.toFixed(2), '손가락:', JSON.stringify(fingers));

      let gesture = '';
      if (palmUp && atChest) gesture = '아프다';
      else if (allClosed && atFace) gesture = '어지럽다';
      else if (onlyIndex && atFace) gesture = '두통';
      else if (allOpen && atChest) gesture = '약';
      else if (allOpen) gesture = '피곤';

      if (gesture) {
        el.innerText = gesture + ' 감지 중...';
        el.style.color = '#718096';
        gestureBuffer.push(gesture);

        if (gestureBuffer.length > CONFIRM_FRAMES) {
          gestureBuffer.shift();
        }

        const allSame = gestureBuffer.length === CONFIRM_FRAMES &&
          gestureBuffer.every(g => g === gestureBuffer[0]);

        if (allSame) {
          el.innerText = gesture + ' 인식됨 ✅';
          el.style.color = '#2b6cb0';
          db.ref('patient_message').set({ text: gesture, time: Date.now() });
          gestureBuffer = [];
        }
      } else {
        el.innerText = '손 인식됨 ✋';
        el.style.color = '#2b6cb0';
        gestureBuffer = [];
      }
    });

    navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
      videoEl.srcObject = stream;
      videoEl.play();
      videoEl.onloadeddata = () => {
        const loop = async () => {
          await hands.send({ image: videoEl });
          requestAnimationFrame(loop);
        };
        loop();
      };
    }).catch((err) => {
      el.innerText = '카메라 오류: ' + err.message;
    });
  </script>
</body>
</html>
